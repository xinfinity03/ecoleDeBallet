<title>École de Ballet Étoile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Ein-Bildschirm-Spiel: Szene als SVG füllt den Bildschirm, HTML-Oberfläche liegt darüber.
   Bewusst nur ein (helles) Farbschema: Bilderbuch-Look wie in einer Pariser Ballettschule. */
:root {
  --rose: #c2456e;      /* Hauptakzent: Ballett-Rosa, kräftig */
  --rose-soft: #fbe3ef;
  --plum: #5b3d4a;      /* Linien und Text */
  --cream: #fff8f0;     /* Flächen der Oberfläche */
  --gold: #f6c64b;      /* Lob-Sterne */
  --night: #2b2236;     /* Letterbox / Hintergrund */
  --ui-font: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --title-font: 'Fredoka', 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--plum); font-family: var(--ui-font); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
#game { position: fixed; inset: 0; }
#stage { width: 100%; height: 100%; display: block; }
#stage text { font-family: var(--ui-font); }
#fade { position: fixed; inset: 0; background: #1a1220; opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 30; }
#fade.on { opacity: 1; }

/* HUD */
.hud { position: fixed; z-index: 10; display: flex; gap: 10px; align-items: center; }
.hud-top-l { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
.hud-top-r { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
.hud-bot-l { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); max-width: min(560px, 70vw); }
.pill { background: var(--cream); border: 3px solid var(--plum); border-radius: 999px; padding: 8px 16px;
  font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 rgba(43,34,54,.35); }
.pill.place { font-family: var(--title-font); font-weight: 600; font-size: 19px; color: var(--rose); }
.pill.stars { display: flex; align-items: center; gap: 6px; }
.pill.stars svg { width: 22px; height: 22px; }
.task { background: var(--cream); border: 3px solid var(--plum); border-radius: 18px; padding: 9px 14px; font-size: 15.5px;
  font-weight: 700; box-shadow: 0 3px 0 rgba(43,34,54,.35); line-height: 1.3; }
.task b { color: var(--rose); }
.round { width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--plum); background: var(--cream);
  display: grid; place-items: center; font-size: 22px; cursor: pointer; box-shadow: 0 3px 0 rgba(43,34,54,.35); color: var(--plum); }
.round:active, .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(43,34,54,.35); }
button { font-family: var(--ui-font); }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

.btn { border: 3px solid var(--plum); background: var(--cream); color: var(--plum); border-radius: 18px; padding: 12px 20px;
  font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 rgba(43,34,54,.35); text-align: left; }
.btn.primary { background: var(--rose); color: #fff; border-color: #7e2547; }
.btn.big { font-size: 22px; padding: 16px 30px; text-align: center; }

#decoBtn { position: fixed; z-index: 11; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); font-size: 21px; padding: 14px 24px; }
#tray { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; background: var(--cream); border-top: 4px solid var(--plum);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); box-shadow: 0 -4px 0 rgba(43,34,54,.15); }
.tray-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.tray-head b { font: 700 21px var(--title-font); color: var(--rose); }
.tray-head span { font-size: 14px; font-weight: 700; opacity: .75; flex: 1; min-width: 200px; }
.tray-head .btn { padding: 8px 22px; }
.tray-items { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.deco-card { flex: 0 0 auto; width: 118px; border: 3px solid var(--plum); border-radius: 18px; background: #fff; padding: 6px 6px 8px; display: grid; justify-items: center; gap: 2px;
  cursor: pointer; color: var(--plum); font-family: var(--ui-font); }
.deco-card svg { width: 96px; height: 76px; }
.deco-card b { font-size: 13.5px; line-height: 1.15; text-align: center; }
.deco-card small { font-size: 12.5px; font-weight: 800; }
.deco-card.placed { background: var(--rose-soft); }
.deco-card.locked { opacity: .8; }
.deco-card small.price { color: #b07a00; }
body.editing .hud-bot-l { display: none; }
body.editing #game { bottom: var(--tray-h, 210px); }
#movein { position: fixed; z-index: 11; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); font-size: 21px; padding: 14px 24px; }

/* Dialog */
#dialog { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(940px, calc(100vw - 28px)); background: var(--cream); border: 4px solid var(--plum); border-radius: 26px;
  box-shadow: 0 6px 0 rgba(43,34,54,.4); display: grid; grid-template-columns: 112px 1fr; gap: 6px 16px; padding: 14px 18px 16px 12px; }
#dialog .face { width: 112px; height: 112px; border-radius: 50%; background: var(--rose-soft); border: 3px solid var(--plum); overflow: hidden; grid-row: span 2; align-self: start; }
#dialog .face svg { width: 100%; height: 100%; }
#dialog .who { font-family: var(--title-font); font-weight: 700; font-size: 22px; color: var(--rose); display: flex; align-items: center; gap: 10px; }
#dialog .say { font-size: 20px; font-weight: 700; line-height: 1.35; min-height: 54px; }
#dialog .choices { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
#dialog .speak { width: 38px; height: 38px; font-size: 17px; }

/* Panels (Treppe, Bestätigung, Schwarzes Brett) */
.modal-bg { position: fixed; inset: 0; z-index: 25; background: rgba(26,18,32,.45); display: grid; place-items: center; padding: 16px; }
.panel { background: var(--cream); border: 4px solid var(--plum); border-radius: 28px; padding: 22px 24px; box-shadow: 0 8px 0 rgba(43,34,54,.4);
  width: min(560px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 92vh; overflow: auto; }
.panel h2 { margin: 0; font-family: var(--title-font); font-weight: 700; color: var(--rose); font-size: 28px; text-align: center; text-wrap: balance; }
.panel p { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4; text-align: center; }
.panel .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.floorbtn { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.floorbtn small { font-weight: 700; opacity: .7; font-size: 14px; }
.floorbtn.here { background: var(--rose-soft); }

/* Toast */
#toast { position: fixed; z-index: 26; top: calc(112px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -20px); opacity: 0;
  background: var(--plum); color: #fff; border-radius: 999px; padding: 12px 22px; font-weight: 800; font-size: 18px; transition: .3s; pointer-events: none; text-align: center; max-width: 90vw; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Start / Avatar */
#start { position: fixed; inset: 0; z-index: 40; overflow: auto; background:
  radial-gradient(circle at 80% 10%, #fff3 0 8%, transparent 9%), linear-gradient(#9fc9ea, #f6d6e4 70%, #f4c9da); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.start-card { background: var(--cream); border: 4px solid var(--plum); border-radius: 32px; padding: 26px 28px; box-shadow: 0 8px 0 rgba(43,34,54,.4);
  width: min(980px, 100%); display: grid; gap: 16px; }
.start-card h1 { margin: 0; font-family: var(--title-font); font-size: clamp(34px, 5vw, 54px); color: var(--rose); text-align: center; line-height: 1.05; }
.start-card .sub { text-align: center; font-weight: 800; font-size: 18px; margin-top: -6px; }
.editor { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
.preview { background: linear-gradient(#e9f3fb, #fdf0d8 75%, #e2b98c 75%); border: 3px solid var(--plum); border-radius: 24px; height: 340px; }
.preview svg { width: 100%; height: 100%; }
.opts { display: grid; gap: 12px; }
.opt-row { display: grid; gap: 6px; }
.opt-row label, .opt-row .lbl { font-weight: 800; font-size: 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--plum); cursor: pointer; box-shadow: 0 3px 0 rgba(43,34,54,.3); }
.sw[aria-pressed="true"] { outline: 4px solid var(--rose); outline-offset: 2px; }
.chip { border: 3px solid var(--plum); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 16px; cursor: pointer; color: var(--plum); }
.chip[aria-pressed="true"] { background: var(--rose); color: #fff; border-color: #7e2547; }
#pname { font: 800 20px var(--ui-font); border: 3px solid var(--plum); border-radius: 14px; padding: 10px 14px; width: min(320px, 100%); color: var(--plum); background: #fff; }
.start-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
@media (max-width: 720px) { .editor { grid-template-columns: 1fr; } .preview { height: 260px; } }

#rotate { position: fixed; inset: 0; z-index: 60; background: var(--night); color: #fff; display: none; place-items: center; text-align: center;
  font: 800 22px var(--ui-font); padding: 24px; }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: grid; } }

/* Ballettunterricht (Rhythmus-Spiel) */
#lesson { position: fixed; inset: 0; z-index: 35; background: #fdf0d8; overflow: hidden; }
#lessonStage { position: absolute; left: 0; right: 0; top: calc(176px + env(safe-area-inset-top, 0px)); bottom: 168px; width: 100%; height: auto; }
.ls-lane { position: absolute; top: calc(62px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); height: 108px;
  background: rgba(255,248,240,.92); border: 3px solid var(--plum); border-radius: 26px; overflow: hidden; }
.ls-target { position: absolute; top: 50%; left: 16%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 4px dashed var(--rose);
  display: grid; place-items: end center; z-index: 1; }
.ls-target span { font: 800 13px var(--ui-font); color: var(--rose); background: var(--cream); padding: 0 6px; border-radius: 6px; transform: translateY(12px); }
.ls-target.beat { transform: scale(1.12); background: rgba(194,69,110,.12); }
.ls-card { position: absolute; top: 50%; width: 86px; height: 92px; margin: -46px 0 0 -43px; background: #fff; border: 3px solid var(--plum); border-radius: 18px;
  display: grid; grid-template-rows: 1fr auto; justify-items: center; z-index: 2; will-change: transform; }
.ls-card svg { width: 64px; height: 64px; }
.ls-card b { font-size: 12px; font-weight: 800; color: var(--plum); line-height: 1; padding-bottom: 5px; }
.ls-card.hit { border-color: #3f9a6a; background: #e6f6ec; }
.ls-card.miss { border-color: #b7a9b0; opacity: .45; }
.ls-hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ls-hud .btn { padding: 7px 16px; font-size: 16px; }
.ls-buttons { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.pose-btn { width: 132px; height: 148px; border: 4px solid var(--plum); border-radius: 22px; background: var(--cream); box-shadow: 0 4px 0 rgba(43,34,54,.35);
  display: grid; grid-template-rows: 1fr auto auto; justify-items: center; padding: 4px 4px 8px; cursor: pointer; color: var(--plum); touch-action: manipulation; }
.pose-btn svg { width: 92px; height: 92px; }
.pose-btn b { font-size: 16px; font-weight: 800; line-height: 1.1; }
.pose-btn small { font-size: 11.5px; font-weight: 700; opacity: .75; line-height: 1.1; }
.pose-btn:active, .pose-btn.pressed { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43,34,54,.35); background: var(--rose-soft); }
@media (max-height: 700px) { .pose-btn { width: 110px; height: 124px; } .pose-btn svg { width: 72px; height: 72px; } #lessonStage { bottom: 142px; } }
#lsFeedback { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); font: 700 44px var(--title-font); opacity: 0; pointer-events: none;
  text-shadow: 0 3px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; transition: transform .15s, opacity .15s; z-index: 3; }
#lsFeedback.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.ls-bubble { position: absolute; left: max(16px, 7vw); top: calc(186px + env(safe-area-inset-top, 0px)); max-width: 300px; background: #fff; border: 3px solid var(--plum); border-radius: 18px;
  padding: 8px 14px; font-weight: 800; font-size: 17px; z-index: 3; }
.ls-bubble[hidden] { display: none; }
#lsPanelBg { position: absolute; inset: 0; background: rgba(26,18,32,.4); display: grid; place-items: center; padding: 16px; z-index: 5; }
.lvl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; text-align: left; }
.lvl small { grid-column: 2; font-weight: 700; opacity: .75; font-size: 14px; }
.lvl .stars-earned { grid-row: span 2; font-size: 22px; color: #e0a91e; min-width: 70px; text-align: center; }
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.learn button { display: grid; justify-items: center; gap: 2px; background: #fff; border: 3px solid var(--plum); border-radius: 18px; padding: 8px; cursor: pointer; color: var(--plum); font-family: var(--ui-font); }
.learn svg { width: 90px; height: 90px; }
.learn b { font-size: 17px; } .learn small { font-size: 13px; font-weight: 700; opacity: .8; }
.result-stars { font-size: 56px; text-align: center; color: #e0a91e; letter-spacing: 6px; }
@media (prefers-reduced-motion: reduce) { #lsFeedback { transition: none; } }

@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.twinkle { animation: twinkle 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { #fade, #toast { transition: none; } .twinkle { animation: none; } }
</style>

<div id="game">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs id="defs"></defs>
    <g id="cam"><g id="scene"></g><g id="decor"></g><g id="actors"></g></g>
  </svg>
</div>

<div class="hud hud-top-l"><div class="pill place" id="place">Entrée</div></div>
<div class="hud hud-top-r">
  <div class="pill stars" title="Lob-Punkte"><svg viewBox="-12 -12 24 24"><path d="M0 -11 l3.2 6.6 7.3 1 -5.3 5.1 1.3 7.3 -6.5 -3.5 -6.5 3.5 1.3 -7.3 -5.3 -5.1 7.3 -1 z" fill="#f6c64b" stroke="#5b3d4a" stroke-width="1.6"/></svg><span id="stars">0</span></div>

  <div class="tray-head"><b>Zimmer einrichten</b><span>Antippen zum Hinstellen · mit dem Finger verschieben · × zum Wegräumen</span><button class="btn primary" id="trayDone">Fertig</button></div>

<div id="dialog" hidden>

<script>
(() => {
'use strict';
// =====================================================================  Grundwerte
const LINE = '#5b3d4a', LW = 2.2;
const FLOOR_Y = 800;               // Bodenlinie aller Szenen
const VH = 900;                    // Höhe der Spielwelt (Breite passt sich dem Bildschirm an)
const SKIN = { hell: '#f6d2b8', mittel: '#e2ad84', dunkel: '#8a5636' };
const HAIR = { braun: '#7a4a2b', blond: '#f0cc6e', hellblond: '#f6dc8f', schwarz: '#2a2030', dunkelbraun: '#4a2c1c', rot: '#c4562e' };
const EYES = { braun: '#4a3528', blau: '#3f6fb0', gruen: '#3f8a5a', grau: '#6b7280' };
const SOFA_IMG = 'data:image/webp;base64,{{SOFA}}';
const KLEID_IMG = 'data:image/webp;base64,{{KLEID}}';
const BILD1_IMG = 'data:image/webp;base64,{{BILD_BALLERINA}}';

// =====================================================================  Figuren-Baukasten
function outlined(d, color, w) {
  return `<path d="${d}" fill="none" stroke="${LINE}" stroke-width="${w + LW * 2}" stroke-linecap="round" stroke-linejoin="round"/>` +
         `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function hairBack(style, c) {
  const s = `stroke="${LINE}" stroke-width="${LW}"`;
  if (style === 'lang_glatt') return `<path d="M-40 -238 C-46 -286 46 -286 40 -238 L46 -150 Q48 -128 40 -122 Q0 -112 -40 -122 Q-48 -128 -46 -150 Z" fill="${c}" ${s}/>`;
  if (style === 'schulter') return `<path d="M-40 -238 C-46 -286 46 -286 40 -238 L44 -196 Q46 -182 34 -180 Q0 -176 -34 -180 Q-46 -182 -44 -196 Z" fill="${c}" ${s}/>`;
  if (style === 'locken_lang') {
    const pts = [[-40,-250],[-44,-228],[-46,-206],[-44,-184],[-38,-166],[40,-250],[44,-228],[46,-206],[44,-184],[38,-166],[-30,-270],[30,-270],[0,-280],[-16,-278],[16,-278]];
    return pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="16" fill="${c}" ${s}/>`).join('') +
      `<path d="M-44 -250 Q0 -300 44 -250 L42 -170 Q0 -160 -42 -170 Z" fill="${c}"/>`;
  }
  if (style === 'zopf') return `<path d="M-40 -238 C-46 -286 46 -286 40 -238 L40 -214 Q0 -206 -40 -214 Z" fill="${c}" ${s}/>` +
      [0,1,2,3].map(k => `<ellipse cx="${30 + k * 3}" cy="${-200 + k * 22}" rx="11" ry="13" fill="${c}" ${s}/>`).join('');
  if (style === 'dutt') return `<circle cx="0" cy="-282" r="17" fill="${c}" ${s}/>`;
  return '';
}
function hairFront(style, c) {
  const s = `stroke="${LINE}" stroke-width="${LW}"`;
  switch (style) {
    case 'lang_glatt': case 'zopf':
      return `<path d="M-37 -234 C-40 -284 40 -284 37 -234 Q30 -258 2 -264 Q-30 -258 -37 -234 Z" fill="${c}" ${s}/>`;
    case 'schulter':
      return `<path d="M-37 -236 C-40 -284 40 -284 37 -236 Q28 -262 4 -262 Q-2 -256 -10 -252 Q-28 -248 -37 -236 Z" fill="${c}" ${s}/>`;
    case 'locken_lang':
      return [[-26,-262,12],[-8,-268,12],[10,-268,12],[27,-261,12],[-36,-246,10],[36,-246,10]].map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${s}/>`).join('');
    case 'dutt':

  o += eiffelView(x, top, w, h, id);
  // Balkongitter draußen (schmiedeeisern)
  const gy = bot - 104;
  o += `<path d="M${x} ${gy} H${x + w} M${x} ${bot - 10} H${x + w}" stroke="#3d3f52" stroke-width="5"/>`;
  for (let gx = x + 14; gx < x + w; gx += 22) o += `<path d="M${gx} ${gy} V${bot - 10}" stroke="#3d3f52" stroke-width="2.5"/>`;

  o += `<circle cx="${x + w / 2 - 12}" cy="${top + h * 0.55}" r="5" fill="#d9b36c" stroke="${LINE}" stroke-width="1.5"/><circle cx="${x + w / 2 + 12}" cy="${top + h * 0.55}" r="5" fill="#d9b36c" stroke="${LINE}" stroke-width="1.5"/>`;
  o += `<rect x="${x - 24}" y="${top - 34}" width="${w + 48}" height="18" rx="4" fill="#efe3d3" stroke="${LINE}" stroke-width="2"/>`;

  o += `<path d="M${x + w + 64} ${top - 50} h-70 q6 ${tie - top} 20 ${tie - top + 46} q24 70 14 ${FLOOR_Y - tie + 4} h48 q6 -120 -8 -${FLOOR_Y - tie - 30} q14 -${tie - top - 40} -4 -${tie - top + 20} z" fill="${curtain}" stroke="${LINE}" stroke-width="2"/>`;
  o += `<rect x="${x - 48}" y="${tie - 2}" width="34" height="12" rx="6" fill="#d9b36c" stroke="${LINE}" stroke-width="1.5"/><rect x="${x + w + 14}" y="${tie - 2}" width="34" height="12" rx="6" fill="#d9b36c" stroke="${LINE}" stroke-width="1.5"/>`;
  return o;
}

function door(x, label, act, opts = {}) {

  const w = opts.w || 150, h = 330, top = FLOOR_Y - h, col = opts.color || '#a8613f', dark = opts.dark || '#8a4c30';

    o += `<circle cx="${x - 12}" cy="${top + 190}" r="6" fill="#f6d26b" stroke="${LINE}"/><circle cx="${x + 12}" cy="${top + 190}" r="6" fill="#f6d26b" stroke="${LINE}"/>`;
  } else {
    o += `<rect x="${x - w / 2}" y="${top}" width="${w}" height="${h}" rx="4" fill="${col}" stroke="${LINE}" stroke-width="2"/>`;

    o += `<rect x="${x - w / 2 + 16}" y="${top + 170}" width="${w - 32}" height="130" rx="6" fill="none" stroke="${dark}" stroke-width="4"/>`;
    o += `<circle cx="${x + w / 2 - 22}" cy="${top + 160}" r="8" fill="#f6d26b" stroke="${LINE}" stroke-width="2"/>`;

  return o + '</g>';

function resize() {

}
function updateCamera() {
  if (!cur) return;

  if (cur.w <= VW) cx = (cur.w - VW) / 2;
  else cx = Math.max(0, Math.min(cur.w - VW, player.x - VW / 2));

}

function placePlayer() {

  player.el.setAttribute('transform', `translate(${player.x},${FLOOR_Y + (cur.floorOffset || 0) + bob}) rotate(${tilt})`);
}

// =====================================================================  Bewegung
let last = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (player.moving) {
    const d = player.tx - player.x, step = 520 * dt;
    if (Math.abs(d) <= step) { player.x = player.tx; player.moving = false; placePlayer(); updateCamera(); const cb = player.onArrive; player.onArrive = null; cb && cb(); }
    else { player.x += Math.sign(d) * step; player.walkT += dt; placePlayer(); updateCamera(); }
  }
  requestAnimationFrame(tick);
}
function walkTo(x, cb) {
  player.tx = Math.max(110, Math.min(cur.w - 110, x));
  player.onArrive = cb || null;
  player.moving = player.tx !== player.x;
  if (!player.moving && cb) { player.onArrive = null; cb(); }
}

function toWorld(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;

}
svg.addEventListener('pointerdown', ev => {
  if (!cur || !$('dialog').hidden || !$('modal').hidden) return;
  if (editing) return decorPointerDown(ev);
  const w = toWorld(ev);
  const hit = ev.target.closest('[data-act]');
  if (hit) return act(hit.getAttribute('data-act'), w.x);
  walkTo(w.x);
});
function act(a, wx) {
  const [kind, arg] = a.split(':');
  if (kind === 'talk') { const n = npcEls.find(e => e.id === arg); const side = player.x < n.x ? -1 : 1; return walkTo(n.x + side * 140, () => startTalk(arg)); }
  if (kind === 'stairs') return walkTo(170, stairMenu);
  if (kind === 'room') { const target = `room${arg}`; const back = S.scene.startsWith('bath'); return walkTo(back ? 140 : wx, () => transition(() => enterScene(target, back ? 1230 : 220))); }
  if (kind === 'bath') return walkTo(1345, () => transition(() => enterScene(`bath${arg}`, 260)));
  if (kind === 'floor') {
    const fl = +arg, from = S.scene;
    let x = 400;
    if (from.startsWith('room')) { const n = +from.slice(4); x = 560 + ((n - 1) % 5) * 320; }
    if (from === 'saal') x = 660; if (from === 'umkleide_w') x = 1100; if (from === 'umkleide_m') x = 1420;
    if (from === 'boutique') x = 700; if (from === 'buero') x = 1150; if (from === 'terrasse') x = 1560; if (from === 'cafe') x = 1540; if (from === 'theater') x = 1860;
    return walkTo(100, () => transition(() => enterScene(`floor${fl}`, x)));
  }
  if (kind === 'scene') return walkTo(wx, () => transition(() => enterScene(arg, 240)));
  if (kind === 'exit') return walkTo(510, () => toast('Paris erkunden kommt später. Erst einmal: Willkommen in der Schule!'));
  if (kind === 'board') return walkTo(1205, boardPanel);
  if (kind === 'telescope') return walkTo(1030, telescopePanel);
  if (kind === 'sight') return sightPanel(arg);
  if (kind === 'wardrobe') return walkTo(1218, () => toast(S.room === cur.room ? 'Hier kannst du dich bald umziehen!' : 'Das ist nicht dein Schrank.'));
}

function playBeat(b, t, beat) {

  const cards = seq.map((k, i) => {

    el.innerHTML = `${miniFig(look, k)}<b>${POSES[k].name}</b>`;
    lane.appendChild(el);
    return { k, t: t0 + (4 + i * lv.gap) * beat, el, done: false };
  });
  // Knöpfe
  const box = $('lsButtons'); box.innerHTML = '';
  for (const k of lv.poses) {
    const b = document.createElement('button'); b.className = 'pose-btn'; b.dataset.pose = k;
    b.innerHTML = `${miniFig(look, k)}<b>${POSES[k].name}</b><small>${POSES[k].de}</small>`;
    b.addEventListener('pointerdown', e => { e.preventDefault(); lsInput(k, b); });
    box.appendChild(b);
  }
  Object.assign(L, { lvl, lv, beat, t0, cards, nextBeat: -4, endT: cards[cards.length - 1].t + beat * 3, running: true,
    points: 0, perfect: 0, good: 0, miss: 0, streak: 0, myPoseUntil: 0, matePoseUntil: 0 });
  $('lsInfo').textContent = `${lv.name} · los geht's!`;
  bubble('Und … un, deux, trois, quatre!');
  requestAnimationFrame(lessonTick);
}
function clock() { return AC ? AC.currentTime : performance.now() / 1000; }
function lessonTick() {
  if (!L || !L.running) return;
  const now = clock(), { beat, t0, lv } = L;
  // Musik vorausplanen
  while (t0 + (L.nextBeat + 4) * beat < now + 0.25) {
    const b = L.nextBeat, t = t0 + (b + 4) * beat;
    if (t > L.endT + beat) break;
    playBeat(b < 0 ? (b === -4 ? -1 : -2) : b, Math.max(t, now), beat);
    L.nextBeat++;
  }
  // Takt-Puls am Zielkreis
  const ph = ((now - t0) / beat) % 1;
  $('lsTarget').classList.toggle('beat', now > t0 && ph < 0.15);
  // Karten bewegen
  const lane = $('lane'), W = lane.clientWidth, tx = Math.max(70, W * 0.16);
  $('lsTarget').style.left = tx + 'px';
  const speed = (W - tx + 60) / (beat * 4);
  let upcoming = null;
  for (const c of L.cards) {
    const x = tx + (c.t - now) * speed;
    c.el.style.transform = `translateX(${x}px)`;
    if (!c.done && now > c.t + lv.win) { c.done = true; c.el.classList.add('miss'); judge('miss'); }
    if (!c.done && !upcoming) upcoming = c;
  }
  // Madame zeigt die nächste Position vor, die Mitschüler tanzen im Takt mit
  if (upcoming && upcoming.t - now < beat * 1.2) setActorPose(L.actors.colletin, upcoming.k);
  for (const c of L.cards) if (Math.abs(now - c.t) < beat * 0.6) { setActorPose(L.actors.mate1, c.k); setActorPose(L.actors.mate2, c.k); L.matePoseUntil = c.t + beat * 0.6; }
  if (now > L.matePoseUntil) { setActorPose(L.actors.mate1, null); setActorPose(L.actors.mate2, null); }
  if (now > L.myPoseUntil) setActorPose(L.actors.me, null);
  const done = L.cards.filter(c => c.done).length;
  $('lsInfo').textContent = `${lv.name} · ${done}/${L.cards.length}`;
  if (now > L.endT) return finishLesson();
  requestAnimationFrame(lessonTick);
}
function lsInput(k, btn) {
  if (!L || !L.running) return;
  const now = clock();
  setActorPose(L.actors.me, k); L.myPoseUntil = now + L.beat * 0.8;
  btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 120);
  // nächste offene Karte im Zeitfenster
  const c = L.cards.find(c => !c.done && Math.abs(c.t - now) <= L.lv.win);
  if (!c) return;   // zu früh: nichts passiert
  c.done = true;
  if (c.k !== k) { c.el.classList.add('miss'); return judge('falsch'); }
  const dt = Math.abs(c.t - now);
  c.el.classList.add('hit');
  judge(dt < L.lv.win * 0.45 ? 'perfekt' : 'gut');
}
const PRAISE = ['Très bien!', 'Magnifique!', 'Bravo!', 'Schön gestreckt!', 'Wunderbar!'];
const TIPS = { miss: ['Achte auf den Takt!', 'Konzentration!', 'Weiter, nicht aufgeben!'], falsch: ['Schau genau hin!', 'Das war die falsche Position.'] };
function judge(r) {
  const fb = $('lsFeedback');
  const t = { perfekt: ['Perfekt! ✨', '#c2456e'], gut: ['Gut!', '#3f9a6a'], miss: ['Verpasst', '#8a7a82'], falsch: ['Falsch', '#b8475c'] }[r];
  fb.textContent = t[0]; fb.style.color = t[1];
  fb.classList.remove('on'); void fb.offsetWidth; fb.classList.add('on');
  clearTimeout(judge.tm); judge.tm = setTimeout(() => fb.classList.remove('on'), 450);
  if (r === 'perfekt') { L.points += 2; L.perfect++; L.streak++; }
  else if (r === 'gut') { L.points += 1; L.good++; L.streak++; }
  else { L.miss++; L.streak = 0; if (Math.random() < .5) bubble(TIPS[r][Math.floor(Math.random() * TIPS[r].length)]); }
  if (L.streak && L.streak % 4 === 0) bubble(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
  $('lsScore').textContent = `✨ ${L.points}`;
}
function bubble(text) {
  const b = $('lsBubble'); b.textContent = 'Madame Colletin: ' + text; b.hidden = false;
  clearTimeout(bubble.tm); bubble.tm = setTimeout(() => { b.hidden = true; }, 1800);
}
function finishLesson() {
  L.running = false;
  const max = L.cards.length * 2, pct = L.points / max;
  const stars = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
  S.lessons = S.lessons || {};
  const before = S.lessons[L.lvl] || 0;
  if (stars > before) S.lessons[L.lvl] = stars;
  S.lessonsDone = (S.lessonsDone || 0) + 1;
  if (stars) { S.stars += stars; $('stars').textContent = S.stars; }
  save();
  setActorPose(L.actors.colletin, stars >= 2 ? 'seconde' : null);
  const words = stars === 3 ? `Excellent! So tanzt ${W() ? 'eine echte Étoile' : 'ein echter Étoile'}!` : stars === 2 ? 'Sehr ordentlich. Weiter so!' : stars === 1 ? 'Ein Anfang. Übung macht den Meister!' : 'Das üben wir noch einmal. Nicht traurig sein!';
  speak(words, 'colletin');
  lsPanel(`<h2>Stunde beendet!</h2><div class="result-stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>Madame Colletin: „${words}"</p>
    <p style="font-size:16px">Perfekt: ${L.perfect} · Gut: ${L.good} · Verpasst: ${L.miss}</p>
    ${stars ? `<p style="color:var(--rose)">★ +${stars} Lob-Punkt${stars > 1 ? 'e' : ''}!</p>` : ''}
    ${stars > before && before ? `<p>Neuer Rekord für „${L.lv.name}"!</p>` : ''}
    <div class="row"><button class="btn" id="lsAgain">Nochmal</button><button class="btn" id="lsOther">Andere Stufe</button><button class="btn primary" id="lsDone">Fertig</button></div>`);
  $('lsAgain').onclick = () => { lsPanelClose(); audio(); startLesson(L.lvl); };
  $('lsOther').onclick = () => { $('lsButtons').innerHTML = ''; clearCards(); levelPanel(); };
  $('lsDone').onclick = closeLesson;
}
function closeLesson() {
  if (L) L.running = false;
  stopSpeak(); lsPanelClose(); clearCards();
  $('lesson').hidden = true; L = null;
  enterScene(S.scene, player.x);
}
$('lsQuit').onclick = () => {
  if (!L) return;
  if (!L.running) return closeLesson();
  L.running = false;
  lsPanel(`<h2>Stunde abbrechen?</h2><p>Dann gibt es für diese Stunde keine Lob-Punkte.</p><div class="row"><button class="btn" id="lsGoOn">Von vorn tanzen</button><button class="btn primary" id="lsStop">Abbrechen</button></div>`);
  const pausedAt = clock();
  $('lsGoOn').onclick = () => { lsPanelClose(); startLesson(L.lvl); };
  $('lsStop').onclick = closeLesson;
};

// =====================================================================  Menü
$('menuBtn').onclick = () => {
  openModal(`<h2>Menü</h2>
    <p>${S.player.name} · ★ ${S.stars} Lob-Punkte · ${S.room ? 'Zimmer ' + S.room : 'noch kein Zimmer'}</p>
    <button class="btn" id="mBack">Weiterspielen</button>
    <button class="btn" id="mEntree">Zurück zur Eingangshalle</button>
    <div class="row" style="align-items:center"><b>Tageszeit:</b>${[['', 'Echte Uhrzeit'], ...Object.entries(PHASES)].map(([k, t]) => `<button class="chip" data-ph="${k}" aria-pressed="${(S.timeOverride || '') === k}">${t}</button>`).join('')}</div>
    <button class="btn" id="mNew">Neues Spiel beginnen</button>`);
  $('mBack').onclick = closeModal;
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { S.timeOverride = b.dataset.ph || null; closeModal(); enterScene(S.scene, player.x); toast('Tageszeit: ' + (S.timeOverride ? PHASES[S.timeOverride] : 'echte Uhrzeit (' + PHASES[phase()] + ')')); });
  $('mEntree').onclick = () => { closeModal(); transition(() => enterScene('floor0', 300)); };
  $('mNew').onclick = () => {
    $('modalPanel').innerHTML = `<h2>Wirklich neu beginnen?</h2><p>Dein Zimmer, deine Lob-Punkte und alle Bekanntschaften werden gelöscht.</p><div class="row"><button class="btn" id="mNo">Nein</button><button class="btn primary" id="mYes">Ja, neu beginnen</button></div>`;
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => { closeModal(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} showStart(null); };
  };
};

// =====================================================================  Start & Avatar
const OPTIONS = {
  skin: [['hell', SKIN.hell], ['mittel', SKIN.mittel], ['dunkel', SKIN.dunkel]],
  hair: [['braun', HAIR.braun], ['blond', HAIR.blond], ['schwarz', HAIR.schwarz], ['rot', HAIR.rot], ['dunkelbraun', HAIR.dunkelbraun]],
  eyes: [['braun', EYES.braun], ['blau', EYES.blau], ['gruen', EYES.gruen], ['grau', EYES.grau]],
  styleW: [['lang_glatt', 'Lang'], ['schulter', 'Schulterlang'], ['locken_lang', 'Locken'], ['dutt', 'Dutt'], ['zopf', 'Zopf']],
  styleM: [['kurz', 'Kurz'], ['seitenscheitel', 'Scheitel'], ['locken_kurz', 'Locken'], ['wellig', 'Wellig'], ['gegelt', 'Gegelt']],
  color: ['#f59ab8', '#b9a2e6', '#8fd3b6', '#9ad1f5', '#f6d26b', '#ff8c7a', '#4b6fb5', '#f6f0f4'],
};
const lighten = c => { const n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, f = v => Math.round(v + (255 - v) * .45); return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join(''); };
let draft = null;
function showStart(saved) {
  $('start').hidden = false;
  const card = $('startCard');
  if (saved) {
    card.innerHTML = `<h1>École de Ballet Étoile</h1><div class="sub">Paris</div>
      <div class="preview" style="height:300px;max-width:260px;margin:0 auto;width:100%"><svg viewBox="-110 -330 220 345">${figureSVG({ ...saved.player, expr: 'froh', arms: ['unten', 'winken'] })}</svg></div>
      <div class="sub">Schön, dass du wieder da bist, ${saved.player.name}!</div>
      <div class="start-actions"><button class="btn big primary" id="sGo">Weiterspielen</button><button class="btn big" id="sNew">Neues Spiel</button></div>`;
    $('sGo').onclick = () => begin(saved);
    $('sNew').onclick = () => showStart(null);
    return;
  }
  draft = draft || { kind: 'w', skin: 'hell', hair: 'braun', hairStyle: 'lang_glatt', eyes: 'braun', color: '#f59ab8', name: '' };
  renderEditor();
}
function renderEditor() {
  const d = draft, card = $('startCard');
  const styles = d.kind === 'w' ? OPTIONS.styleW : OPTIONS.styleM;
  if (!styles.some(s => s[0] === d.hairStyle)) d.hairStyle = styles[0][0];
  const sw = (key, list) => list.map(([v, c]) => `<button class="sw" style="background:${c}" aria-label="${v}" aria-pressed="${d[key] === v}" data-k="${key}" data-v="${v}"></button>`).join('');
  card.innerHTML = `<h1>École de Ballet Étoile</h1><div class="sub">Willkommen in Paris! Wer bist du?</div>
    <div class="editor">
      <div class="preview"><svg viewBox="-110 -330 220 345">${figureSVG({ ...d, tutu: lighten(d.color), expr: 'froh', arms: ['unten', 'winken'] })}</svg></div>
      <div class="opts">
        <div class="opt-row"><span class="lbl">Ich bin …</span><div class="swatches">
          <button class="chip" aria-pressed="${d.kind === 'w'}" data-k="kind" data-v="w">eine Tänzerin</button>
          <button class="chip" aria-pressed="${d.kind === 'm'}" data-k="kind" data-v="m">ein Tänzer</button></div></div>
        <div class="opt-row"><label for="pname">Mein Name</label><input id="pname" maxlength="14" autocomplete="off" placeholder="${d.kind === 'w' ? 'z. B. Emma' : 'z. B. Paul'}" value="${d.name.replace(/"/g, '')}"></div>
        <div class="opt-row"><span class="lbl">Hautfarbe</span><div class="swatches">${sw('skin', OPTIONS.skin)}</div></div>
        <div class="opt-row"><span class="lbl">Haarfarbe</span><div class="swatches">${sw('hair', OPTIONS.hair)}</div></div>
        <div class="opt-row"><span class="lbl">Frisur</span><div class="swatches">${styles.map(([v, t]) => `<button class="chip" aria-pressed="${d.hairStyle === v}" data-k="hairStyle" data-v="${v}">${t}</button>`).join('')}</div></div>
        <div class="opt-row"><span class="lbl">Augenfarbe</span><div class="swatches">${sw('eyes', OPTIONS.eyes)}</div></div>
        <div class="opt-row"><span class="lbl">Farbe ${d.kind === 'w' ? 'vom Tutu' : 'vom Shirt'}</span><div class="swatches">${OPTIONS.color.map(c => `<button class="sw" style="background:${c}" aria-label="Farbe" aria-pressed="${d.color === c}" data-k="color" data-v="${c}"></button>`).join('')}</div></div>
      </div>
    </div>
    <div class="start-actions"><button class="btn big primary" id="sGo">Los geht's! ♥</button></div>`;
  card.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { d.name = $('pname').value; d[b.dataset.k] = b.dataset.v; renderEditor(); });
  $('pname').oninput = e => { d.name = e.target.value; };
  $('sGo').onclick = () => {
    const name = ($('pname').value.trim() || (d.kind === 'w' ? 'Emma' : 'Paul')).slice(0, 14);
    const st = defaultState();
    st.player = { kind: d.kind, skin: d.skin, hair: d.hair, hairStyle: d.hairStyle, eyes: d.eyes, color: d.color, tutu: lighten(d.color), name };
    begin(st, true);
  };
}
function begin(state, fresh) {
  S = state;
  $('start').hidden = true;
  $('stars').textContent = S.stars;
  updateSoundBtn();
  resize();
  enterScene(S.scene || 'floor0', S.x || 520);
  if (fresh) setTimeout(() => toast(`Bienvenue, ${S.player.name}! Willkommen in der École de Ballet Étoile!`), 400);
}
addEventListener('resize', resize);
window.claude?.hot?.snapshot?.(() => S ? { ...S, x: player.x } : null);
function boot(data) {
  const saved = (data && data.player) ? data : load();
  if (data && data.player) return begin(data);
  showStart(saved);
}
addEventListener('beforeunload', () => { if (S) { S.x = player.x; save(); } });
setInterval(() => { if (S && cur) { S.x = player.x; save(); } }, 4000);
let lastPhase = null;
setInterval(() => { if (!S || !cur) return; const ph = phase(); if (lastPhase && ph !== lastPhase && $('dialog').hidden && $('modal').hidden && !player.moving) enterScene(S.scene, player.x); lastPhase = ph; }, 30000);
window.__etoile = { go: (id, x) => enterScene(id, x), state: () => S, lesson: () => openLesson(), L: () => L, clock: () => clock() };
requestAnimationFrame(tick);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null);
})();
</script>
